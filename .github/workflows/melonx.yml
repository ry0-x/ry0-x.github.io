name: Update MeloNX

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Latest MeloNX
        run: |
          set -euo pipefail
          mkdir -p apps/emulators

          LATEST_ID=$(curl --fail --silent --show-error --location "https://git.ryujinx.app/melonx/emu/-/releases" | grep -oP 'package_files/\K[0-9]+' | sort -rn | head -n 1 || true)
          if [ -z "$LATEST_ID" ]; then
            echo "Could not identify the latest MeloNX package. Refusing to publish a fallback build."
            exit 1
          fi

          curl --fail --location "https://git.ryujinx.app/melonx/emu/-/package_files/$LATEST_ID/download" -o apps/emulators/melonx.ipa
          unzip -t apps/emulators/melonx.ipa >/dev/null

      - name: Upload to Nightly Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create nightly --title "Nightly Builds" --notes "Auto-updated nightly builds" || echo "Release exists"
          gh release upload nightly apps/emulators/melonx.ipa --clobber

      - name: Update MeloNX metadata by bundle identifier
        env:
          TARGET_BUNDLE_IDENTIFIER: com.stossy11.MelonNX
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/nightly/melonx.ipa
        run: |
          set -euo pipefail
          if ! REAL_VERSION="$(curl --fail --silent --show-error --location --retry 3 -H 'Accept: application/json' 'https://git.ryujinx.app/api/v4/projects/melonx%2Femu/releases' | jq -er '.[0].tag_name | strings | sub("^v"; "")')"; then
            echo "Could not retrieve a verified MeloNX release version; leaving repo.json unchanged." >&2
            exit 1
          fi
          if ! printf '%s' "$REAL_VERSION" | grep -Eq '^[0-9]+([.][0-9A-Za-z][0-9A-Za-z._+-]*)*$'; then
            echo "Rejected non-version release value: $REAL_VERSION" >&2
            exit 1
          fi

          DATE_NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          FILESIZE=$(stat -c%s "apps/emulators/melonx.ipa")

          jq -e --arg bundle_identifier "$TARGET_BUNDLE_IDENTIFIER" \
             --arg version "$REAL_VERSION" \
             --arg date "$DATE_NOW" \
             --arg download_url "$RELEASE_URL" \
             --argjson size "$FILESIZE" \
             '([.apps[] | select(.bundleIdentifier == $bundle_identifier)] | length) as $count
              | if $count == 1 then
                (.apps[] | select(.bundleIdentifier == $bundle_identifier) | .versions[0]) |=
                  (.version = $version | .date = $date | .downloadURL = $download_url | .size = $size)
              else
                error("Expected exactly one MeloNX record, found \($count)")
              end' repo.json > temp.json && mv temp.json repo.json
          echo "REAL_VERSION=$REAL_VERSION" >> "$GITHUB_ENV"

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Auto-update MeloNX to Version $REAL_VERSION" || echo "No changes"
          git push
