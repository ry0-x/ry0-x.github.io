name: Minecraft Cloudflare R2 IPA Fetcher

on:
  workflow_dispatch:
    inputs:
      channel_username:
        description: 'Primary Telegram Channel Username'
        required: true
        default: 'm_ipa_real'
      app_name:
        description: 'App Name in repo.json'
        required: true
        default: 'Minecraft'

permissions:
  contents: write

jobs:
  fetch-and-upload-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install telethon cryptg

      - name: Fetch IPA and Extract Info
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHANNEL: ${{ github.event.inputs.channel_username }}
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          cat << 'EOF' > fetch_tg.py
          import os, asyncio, re
          from datetime import datetime, timezone
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ.get('TG_API_ID'))
          api_hash = os.environ.get('TG_API_HASH')
          session_str = os.environ.get('TG_SESSION')
          primary_channel = os.environ.get('CHANNEL')
          app_name_input = os.environ.get('APP_NAME')

          # قائمة القنوات: يبدأ بالأساسية، وإذا فشل يروح للبديلة
          CHANNELS = [primary_channel, 'minecraft_ipa_real']

          async def main():
              client = TelegramClient(StringSession(session_str), api_id, api_hash)
              await client.connect()
              
              downloaded_file = None
              original_name = ""
              
              for channel in CHANNELS:
                  print(f"🔍 Searching @{channel} for latest IPA...")
                  try:
                      messages = await client.get_messages(channel, limit=20)
                      for msg in messages:
                          if msg.document and msg.file.name and msg.file.name.lower().endswith('.ipa'):
                              original_name = msg.file.name
                              print(f"📥 Found: {original_name} in @{channel}. Downloading...")
                              downloaded_file = await client.download_media(msg, file=original_name)
                              break # الخروج من حلقة الرسائل
                      
                      if downloaded_file:
                          print(f"✅ Successfully downloaded from @{channel}!")
                          break # الخروج من حلقة القنوات لأنه لقى الملف
                      else:
                          print(f"⚠️ No IPA found in @{channel}. Moving to next channel...")
                          
                  except Exception as e:
                      print(f"⚠️ Failed to access @{channel} (Maybe banned or private). Error: {e}")
                      print("🔄 Trying the next channel in list...")
              
              await client.disconnect()
              
              if downloaded_file:
                  # 1. استخراج رقم الإصدار بذكاء من اسم الملف في تيليجرام
                  version_match = re.search(r'(\d+\.\d+(?:\.\d+)*)', original_name)
                  if version_match:
                      extracted_version = version_match.group(1)
                  else:
                      extracted_version = "1.0" # إصدار افتراضي
                  
                  # 2. تغيير اسم الملف ليكون نظيف: (مثلاً Minecraft_1.26.44.ipa)
                  clean_app_name = re.sub(r'[^A-Za-z0-9]', '', app_name_input)
                  new_file_name = f"{clean_app_name}_{extracted_version}.ipa"
                  
                  os.rename(downloaded_file, new_file_name)
                  
                  # 3. جلب تاريخ اللحظة الحالية (وقت الرفع للريبو)
                  upload_date_str = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                  
                  # حفظ المتغيرات لباقي الخطوات
                  env_file = os.environ.get('GITHUB_ENV')
                  with open(env_file, 'a') as f:
                      f.write(f"IPA_FILE={new_file_name}\n")
                      f.write(f"APP_VERSION={extracted_version}\n")
                      f.write(f"UPLOAD_DATE={upload_date_str}\n")
              else:
                  print("❌ Critical Error: No IPA found in ANY of the provided channels.")
                  exit(1)

          asyncio.run(main())
          EOF
          python fetch_tg.py

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          echo "Uploading $IPA_FILE to Cloudflare R2..."
          aws s3 cp "$IPA_FILE" "s3://$R2_BUCKET/$IPA_FILE" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Update repo.json
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          FILESIZE=$(stat -c%s "$IPA_FILE")
          
          # تجهيز الرابط المباشر
          DIRECT_URL="${R2_PUBLIC_URL}/${IPA_FILE}"
          
          echo "Direct Link: $DIRECT_URL"
          echo "Version: $APP_VERSION"
          echo "Upload Date: $UPLOAD_DATE"
          
          jq --arg app "$APP_NAME" --arg v "$APP_VERSION" --arg u "$DIRECT_URL" --arg d "$UPLOAD_DATE" --argjson s "$FILESIZE" \
          '(.apps[] | select(.name == $app)).versions[0] |= . + {version: $v, date: $d, downloadURL: $u, size: $s}' repo.json > tmp.json && mv tmp.json repo.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "🚀 Auto-Updated $APP_NAME v$APP_VERSION (Hosted on R2)" || echo "No changes to commit"
          
          # تحديث المستودع قبل الرفع لتجنب التعارض (git push rejected)
          git pull --rebase origin main
          git push
