name: Update Amethyst

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Amethyst ZIP
        run: |
          curl -L "https://nightly.link/AngelAuraMC/Amethyst-iOS/workflows/development/main/org.angelauramc.amethyst-ios.ipa.zip" -o amethyst.zip

      - name: Extract IPA
        run: unzip amethyst.zip

      - name: Rename IPA
        run: |
          IPA=$(find . -name "*.ipa" | head -n 1)
          mv "$IPA" amethyst.ipa

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create nightly --title "Nightly Builds" --notes "Auto-updated nightly builds" || echo "Release already exists"
          gh release upload nightly amethyst.ipa --clobber

      - name: Update Amethyst metadata by bundle identifier
        env:
          TARGET_BUNDLE_IDENTIFIER: org.angelauramc.amethyst
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/nightly/amethyst.ipa
        run: |
          set -euo pipefail
          VERSION=$(date -u +'%Y.%m.%d.%H%M')
          DATE_NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          FILESIZE=$(stat -c%s amethyst.ipa)

          jq -e --arg bundle_identifier "$TARGET_BUNDLE_IDENTIFIER" \
             --arg version "$VERSION" \
             --arg date "$DATE_NOW" \
             --arg download_url "$RELEASE_URL" \
             --argjson size "$FILESIZE" '
            ([.apps[] | select(.bundleIdentifier == $bundle_identifier)] | length) as $count
            | if $count == 1 then
              (.apps[] | select(.bundleIdentifier == $bundle_identifier) | .versions[0]) |=
                (.version = $version | .date = $date | .downloadURL = $download_url | .size = $size)
            else
              error("Expected exactly one Amethyst record, found \($count)")
            end
          ' repo.json > temp.json && mv temp.json repo.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Commit & push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Update Amethyst to $VERSION" || echo "No changes to commit"
          git push
